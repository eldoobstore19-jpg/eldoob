<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070d1f">
<title>ELDOOB.DZ — متجر الدب</title>
<link rel="icon" href="/assets/logo.svg">
<style>
:root{--bg:#070d1f;--bg2:#0b1430;--card:#0f1a38;--card2:#142247;--tx:#e8efff;--mu:#8ea0c9;--line:#1d2d5a;--ac:#3d8bff;--ac2:#6fb1ff;--glow:0 0 14px rgba(61,139,255,.45);--ok:#22c58b;--bad:#ff5d73;--warn:#f5b73d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#142a66 0,var(--bg) 60%) fixed;color:var(--tx);font:15px/1.65 system-ui,'Segoe UI',Tahoma,sans-serif;padding-bottom:84px;min-height:100vh}
#top{position:sticky;top:0;z-index:5;background:rgba(11,20,48,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px}
#brand{display:flex;align-items:center;gap:8px;flex:1}#brand small{color:var(--mu)}
#tt{display:flex;align-items:center;gap:8px;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
#cm{background:linear-gradient(135deg,var(--ac),#2a62d9);color:#fff;border-radius:14px;padding:4px 12px;cursor:pointer;font-size:12px;text-align:center;box-shadow:var(--glow)}#cm b{display:block;font-size:14px}
#body{max-width:760px;margin:0 auto;padding:12px}
#nav{position:fixed;bottom:0;inset-inline:0;background:rgba(11,20,48,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}
#nav button span{display:block;font-size:20px}#nav button.on{color:var(--ac2);font-weight:700;text-shadow:var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:start;color:inherit;font:inherit;transition:.15s}
.p:active{transform:scale(.98);box-shadow:var(--glow)}
.im{position:relative;aspect-ratio:1;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:44px}
.im img{width:100%;height:100%;object-fit:cover}
.out{position:absolute;inset:0;background:#000a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.p .b{padding:10px 12px}.p .t{font-weight:700}.pr{color:var(--ac2);font-weight:800}
.mute{color:var(--mu);font-size:13px}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;background:var(--card2);color:var(--mu)}
.t-Pending,.t-Requested{background:#3a2f0e;color:var(--warn)}.t-Shipped,.t-Processing{background:#10294f;color:var(--ac2)}
.t-Delivered,.t-Completed{background:#0d3a2d;color:var(--ok)}.t-Cancelled,.t-Retour,.t-Rejected{background:#43161f;color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mu)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--tx);font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:var(--glow)}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--ac2),var(--ac) 55%,#2a62d9);color:#fff;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--glow)}
.btn.sm{display:inline-block;width:auto;padding:6px 14px;font-size:13px}
.btn.gh{background:none;border:1px solid var(--line);color:var(--tx);box-shadow:none}.btn.dk{background:var(--card2);box-shadow:none}.btn.bad{background:linear-gradient(135deg,#ff7c8d,var(--bad))}
.link{background:none;border:0;color:var(--ac2);cursor:pointer;font:inherit}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.o{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;color:var(--ac2)}.stat span{font-size:12px;color:var(--mu)}
.cover{height:90px;background:linear-gradient(135deg,#0b1a44,var(--ac))}
.pav{width:84px;height:84px;margin:-42px auto 0;border:3px solid var(--card);font-size:36px}
.vok{color:var(--ok);font-size:12px}
.steps{display:flex;justify-content:center;gap:8px;margin:0 0 12px}.steps i{width:28px;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--ac);box-shadow:var(--glow)}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:2;cursor:pointer}
.sw s{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:99px;transition:.2s}
.sw s:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.2s}
.sw input:checked+s{background:var(--ac);box-shadow:var(--glow)}.sw input:checked+s:after{inset-inline-start:23px;background:#fff}
.toast{position:fixed;bottom:96px;inset-inline:16px;max-width:420px;margin:auto;background:#1a2a55;color:#fff;padding:11px 16px;border-radius:16px;text-align:center;z-index:40;border:1px solid var(--line)}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok);color:#04231a}
#sheet{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sheet.mid{align-items:center;padding:20px}
#sheet .in{background:var(--card);border:1px solid var(--line);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px}
#sheet.mid .in{border-radius:26px;max-width:380px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="top" hidden><div id="brand" hidden></div><div id="cm" hidden>رصيدي<b id="cv"></b></div><div id="tt" hidden><div class="av" id="av"></div><span id="nm" class="mute"></span></div></div>
<div id="body"></div>
<nav id="nav" hidden></nav>
<div id="sheet" hidden><div class="in" id="sin"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js?v=2"></script>
</body>
</html>
