<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#070d1f">
<title>ELDOOB.DZ — متجر الدب</title>
<link rel="icon" type="image/png" href="/assets/logo-mark.png">
<link rel="apple-touch-icon" href="/assets/logo-mark.png">
<style>
:root{--bg:#070d1f;--bg2:#0b1430;--card:#0f1a38;--card2:#142247;--tx:#e8efff;--mu:#8ea0c9;--line:#1d2d5a;--ac:#3d8bff;--ac2:#6fb1ff;--glow:0 0 14px rgba(61,139,255,.45);--ok:#22c58b;--bad:#ff5d73;--warn:#f5b73d;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#142a66 0,var(--bg) 60%) fixed;color:var(--tx);font:15px/1.65 system-ui,'Segoe UI',Tahoma,sans-serif;padding-bottom:84px;min-height:100vh}
#top{position:sticky;top:0;z-index:5;background:rgba(11,20,48,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;align-items:center;gap:10px}
#brand{display:flex;align-items:center;gap:8px;flex:1}#brand small{color:var(--mu)}
#tt{display:flex;align-items:center;gap:8px;cursor:pointer}
.av{width:38px;height:38px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
#cm{background:linear-gradient(135deg,var(--ac),#2a62d9);color:#fff;border-radius:14px;padding:4px 12px;cursor:pointer;font-size:12px;text-align:center;box-shadow:var(--glow)}#cm b{display:block;font-size:14px}
#body{max-width:760px;margin:0 auto;padding:12px}
#nav{position:fixed;bottom:0;inset-inline:0;background:rgba(11,20,48,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;padding:8px 0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}
#nav button span{display:block;font-size:20px}#nav button.on{color:var(--ac2);font-weight:700;text-shadow:var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;cursor:pointer;text-align:start;color:inherit;font:inherit;transition:.15s}
.p:active{transform:scale(.98);box-shadow:var(--glow)}
.im{position:relative;aspect-ratio:1;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:44px}
.im img{width:100%;height:100%;object-fit:cover}
.out{position:absolute;inset:0;background:#000a;color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.p .b{padding:10px 12px}.p .t{font-weight:700}.pr{color:var(--ac2);font-weight:800}
.mute{color:var(--mu);font-size:13px}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;background:var(--card2);color:var(--mu)}
.t-Pending,.t-Requested{background:#3a2f0e;color:var(--warn)}.t-Shipped,.t-Processing{background:#10294f;color:var(--ac2)}
.t-Delivered,.t-Completed{background:#0d3a2d;color:var(--ok)}.t-Cancelled,.t-Retour,.t-Rejected{background:#43161f;color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px}
label{display:block;margin-bottom:10px;font-size:13px;color:var(--mu)}
input,select,textarea{display:block;width:100%;margin-top:4px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--bg2);color:var(--tx);font:inherit;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:var(--glow)}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--ac2),var(--ac) 55%,#2a62d9);color:#fff;border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;cursor:pointer;box-shadow:var(--glow)}
.btn.sm{display:inline-block;width:auto;padding:6px 14px;font-size:13px}
.btn.gh{background:none;border:1px solid var(--line);color:var(--tx);box-shadow:none}.btn.dk{background:var(--card2);box-shadow:none}.btn.bad{background:linear-gradient(135deg,#ff7c8d,var(--bad))}
.link{background:none;border:0;color:var(--ac2);cursor:pointer;font:inherit}
.empty{text-align:center;color:var(--mu);padding:30px 10px}
.o{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px;text-align:center}
.stat b{display:block;color:var(--ac2)}.stat span{font-size:12px;color:var(--mu)}
.cover{height:90px;background:linear-gradient(135deg,#0b1a44,var(--ac))}
.pav{width:84px;height:84px;margin:-42px auto 0;border:3px solid var(--card);font-size:36px}
.vok{color:var(--ok);font-size:12px}
.steps{display:flex;justify-content:center;gap:8px;margin:0 0 12px}.steps i{width:28px;height:5px;border-radius:9px;background:var(--line)}.steps i.on{background:var(--ac);box-shadow:var(--glow)}
.sw{position:relative;width:48px;height:28px;flex:none}.sw input{opacity:0;width:100%;height:100%;margin:0;position:absolute;z-index:2;cursor:pointer}
.sw s{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:99px;transition:.2s}
.sw s:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:var(--mu);transition:.2s}
.sw input:checked+s{background:var(--ac);box-shadow:var(--glow)}.sw input:checked+s:after{inset-inline-start:23px;background:#fff}
.toast{position:fixed;bottom:96px;inset-inline:16px;max-width:420px;margin:auto;background:#1a2a55;color:#fff;padding:11px 16px;border-radius:16px;text-align:center;z-index:40;border:1px solid var(--line)}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok);color:#04231a}
#sheet{position:fixed;inset:0;background:#000a;z-index:30;display:flex;align-items:flex-end;justify-content:center}
#sheet.mid{align-items:center;padding:20px}
#sheet .in{background:var(--card);border:1px solid var(--line);width:100%;max-width:560px;max-height:90vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px}
#sheet.mid .in{border-radius:26px;max-width:380px;text-align:center}
.sec{font-weight:800;margin:6px 2px 10px;display:flex;align-items:center;gap:8px}.sec:before{content:"";width:4px;height:16px;border-radius:9px;background:var(--ac);box-shadow:var(--glow)}
:root{--gold:#ffcf5c}
@keyframes mq{to{transform:translateX(-50%)}}
.mq{direction:ltr;overflow:hidden;margin-bottom:16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask-image:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent)}
.mqt{display:flex;width:max-content;animation:mq var(--d,30s) linear infinite}
.mq:active .mqt,.mq:hover .mqt{animation-play-state:paused}
.mqi{width:118px;height:118px;margin-right:10px;border-radius:16px;overflow:hidden;flex:none;border:1px solid var(--line);background:var(--card2);cursor:pointer}
.mqi img{width:100%;height:100%;object-fit:cover;display:block}
.p{display:block}.p .pr,.bigp{color:var(--gold)}
.hrt{position:absolute;top:8px;inset-inline-start:8px;width:32px;height:32px;border-radius:50%;background:rgba(7,13,31,.65);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;z-index:2}
.hrt.on{color:var(--bad)}.hrt.on svg{fill:var(--bad)}
.sd{color:var(--mu);font-size:12px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:2px 0 4px}
.stk{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700}
.s2{background:#0d3a2d;color:var(--ok)}.s1{background:#3a2f0e;color:var(--warn)}.s0{background:#43161f;color:var(--bad)}
.bk{display:inline-flex;align-items:center;gap:4px;background:none;border:0;color:var(--ac2);font:inherit;cursor:pointer;padding:4px 0 10px}
.gal{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--card2)}
.gt{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.gt::-webkit-scrollbar{display:none}
.gt img{flex:none;width:100%;aspect-ratio:1;max-height:420px;object-fit:cover;scroll-snap-align:center}
.gph{width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:60px}
.dots{position:absolute;bottom:10px;inset-inline:0;display:flex;justify-content:center;gap:6px;pointer-events:none}.dots i{width:7px;height:7px;border-radius:9px;background:#fff6;transition:.2s}.dots i.on{width:20px;background:#fff}
.cpr{margin:12px 0 4px;display:flex}
.cp{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line);color:var(--ac2);border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.pn{margin:4px 0 12px;font-size:20px;line-height:1.5}
.dsc .dh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dt{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:#cfd9f5;white-space:pre-line}.dt.open{display:block}
.pbox{background:linear-gradient(135deg,#10234f,#0e1c40);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.bigp{font-size:28px;font-weight:800;line-height:1.3}
.bar{height:6px;border-radius:9px;background:var(--card2);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;border-radius:9px}
.cta{position:sticky;bottom:72px;z-index:4;padding:8px 0}
.btn:disabled{opacity:.5;box-shadow:none;cursor:not-allowed}
.qs{display:flex;gap:8px;align-items:center;margin-top:4px}.qs button{width:44px;height:44px;flex:none;border-radius:14px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:20px;cursor:pointer}.qs input{text-align:center;margin:0}
.o.tot{border:0;font-size:17px}.o.tot b{color:var(--gold);font-size:19px}
.seg{display:flex;gap:8px;margin:4px 0 12px}.seg button{flex:1;padding:11px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;cursor:pointer}.seg button.on{border-color:var(--ac);background:#10294f;color:var(--ac2);font-weight:700;box-shadow:var(--glow)}
.p .im{aspect-ratio:4/5}
.p .b{padding:6px 9px 8px}
.p .t{font-size:13px;font-weight:700;line-height:1.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p .sd{display:block;-webkit-line-clamp:unset;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;line-height:1.4;margin:0 0 3px}
.pk{display:flex;align-items:center;justify-content:space-between;gap:6px}
.pk .pr{font-size:14px;white-space:nowrap}.pk .stk{padding:1px 8px;font-size:11px;white-space:nowrap}
.nrow{display:flex;gap:8px;margin-top:8px}.nrow input{margin:0;flex:1}
.note{margin-top:8px;padding:8px 10px;border-radius:12px;background:#1b2a4d;border-inline-start:3px solid var(--gold);color:#e8eeff;font-size:13px;line-height:1.6;white-space:pre-line}
.cpr{flex-wrap:wrap;gap:8px}.cp.on{border-color:var(--ac);color:#fff;background:#10294f}
.ann{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;margin-bottom:12px;border-radius:var(--r);background:linear-gradient(135deg,#3a2f0e,#1b2a4d);border:1px solid #6b5a1f;line-height:1.6;white-space:pre-line}.ann button{background:none;border:0;color:var(--mu);cursor:pointer;padding:0}
.pcard .ph{display:flex;justify-content:space-between;align-items:center;gap:8px}.pamt{font-size:26px;font-weight:800;color:var(--gold);line-height:1.3;margin-top:4px}
.pinfo{margin:10px 0;border:1px solid var(--line);border-radius:14px;overflow:hidden}.pinfo>div{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}.pinfo>div:last-child{border:0}.pinfo .l{color:var(--mu);font-size:13px}.pinfo a{color:var(--ac2)}
.pinfo .acc{flex-wrap:wrap}.pinfo .acc b{font-size:15px;letter-spacing:.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pacts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.pacts .btn{width:100%;margin:0}.pacts .full{grid-column:1/-1}
.btn.ok{background:linear-gradient(135deg,#2bd99b,var(--ok));color:#04281c;box-shadow:none}.btn.rj{background:none;border:1px solid var(--bad);color:var(--bad);box-shadow:none}
#top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px}
#tt{display:flex;align-items:center;gap:10px;min-width:0}
#tt .av{width:42px;height:42px;border:2px solid var(--gold);box-shadow:0 0 0 3px rgba(255,207,92,.12)}
#tt .who{display:flex;flex-direction:column;min-width:0;line-height:1.35}
#nm{font-size:15px;font-weight:800;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
#rl{font-size:11px;color:var(--mu)}
#brand{display:none!important}
#cm{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;background:linear-gradient(135deg,#17306b,#10234f);border:1px solid var(--line);cursor:pointer;color:var(--gold)}
#cv{font-size:15px;font-weight:800;color:var(--gold);white-space:nowrap}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="top" hidden><div id="tt" hidden><div class="av" id="av"></div><div class="who"><b id="nm"></b><small id="rl"></small></div></div><div id="brand" hidden></div><div id="cm" hidden><span id="ci" style="display:flex"></span><b id="cv"></b></div></div>
<div id="body"></div>
<nav id="nav" hidden></nav>
<div id="sheet" hidden><div class="in" id="sin"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="/app.js?v=11"></script>
</body>
</html>
