<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELDOOB.DZ — متجر الدب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--ink:#121212;--gold:#C9A24B;--gold-hi:#E9CF87;--gold-lo:#8F7330;--bg:#F8FAFC;--card:#fff;--text:#121212;--mute:#64748b;--line:#e2e8f0;--out:#e5e7eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#1a1a1c;--text:#f1f5f9;--mute:#94a3b8;--line:#2d2d31;--out:#000;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#1a1a1c;--text:#f1f5f9;--mute:#94a3b8;--line:#2d2d31;--out:#000;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--out);font-family:Cairo,Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5;color:var(--text);display:flex;justify-content:center}
.phone{width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:600px){body{align-items:center}.phone{height:min(860px,96%);border-radius:30px;border:6px solid var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25)}}
.brand{position:relative;background:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px 0;color:#fff;flex:none}.brand b{font-weight:800;letter-spacing:1px;color:var(--gold-hi)}.brand small{color:#a1a1aa;font-size:12px}
.top{background:var(--ink);padding:10px 12px;display:flex;align-items:center;gap:10px;flex:none}
.top button{border:0;font:inherit;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:#3f3f46;color:#fff;font-size:20px;display:grid;place-items:center;border:2px solid var(--gold);flex:none}
.name{flex:1;background:#27272a;color:#fff;border-radius:99px;padding:8px 14px;text-align:start;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.com{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#121212;border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px;white-space:nowrap}
.com small{font-weight:600;font-size:11px;display:block;line-height:1;margin-bottom:1px}
.body{flex:1;overflow-y:auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:start;padding:0;font:inherit;color:inherit;display:block;width:100%}
.p .im{aspect-ratio:1/1;display:grid;place-items:center;font-size:48px;background:#eef2f7;position:relative}
.p .b{padding:8px 10px}.p .t{font-size:14px;font-weight:600;line-height:1.3}
.pr{font-weight:800}.mute{color:var(--mute);font-size:12px}
.out{position:absolute;inset:0;background:rgba(18,18,18,.6);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:600}
.nav{flex:none;display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 8px 10px;gap:8px}
.nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;color:var(--mute);border-radius:99px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.nav button span{font-size:20px;line-height:1.2}
.nav button.on{background:var(--ink);color:var(--gold);font-weight:600}
.btn{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#121212;border:0;border-radius:10px;font:inherit;font-weight:700;padding:11px 14px;cursor:pointer;width:100%}
.btn.sm{width:auto;padding:4px 10px;font-size:13px;border-radius:8px}.btn.dk{background:var(--ink);color:#fff}.btn.gh{background:none;border:1px solid var(--line);color:var(--text)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);width:100%}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mute);gap:3px;margin-bottom:9px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.sheet{position:absolute;inset:0;background:var(--bg);z-index:5;display:flex;flex-direction:column}
.sheet .h{display:flex;align-items:center;justify-content:space-between;padding:12px;background:var(--card);border-bottom:1px solid var(--line);font-weight:700}
.x{background:none;border:0;font-size:22px;cursor:pointer;color:var(--text)}
.calc{background:var(--ink);color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:grid;grid-template-columns:1fr auto;gap:3px 10px;font-size:14px}
.calc .big{color:var(--gold);font-weight:800;font-size:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card h3{margin:0 0 8px;font-size:15px}
.w{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.w>div{border-radius:12px;padding:12px;background:var(--ink);color:#fff}.w .n{font-size:20px;font-weight:800;color:var(--gold)}
.w>div.a{background:var(--card);color:var(--text);border:1px solid var(--line)}.w>div.a .n{color:var(--text)}
.o{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;align-items:center}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:#e2e8f0;color:#334155}
.t-Pending,.t-Requested,.t-Shipped{background:#fef3c7;color:#92400e}.t-Delivered,.t-Completed{background:#dcfce7;color:#166534}.t-Retour,.t-Cancelled,.t-Rejected{background:#fee2e2;color:#991b1b}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;border:1px solid var(--gold);font-size:13px;z-index:20;width:max-content;max-width:90%}
.car{position:relative;overflow:hidden;border-radius:12px;aspect-ratio:16/9;background:#222;touch-action:pan-y;margin-bottom:10px}
.trk{display:flex;height:100%;transition:transform .35s}
.sl{flex:0 0 100%;display:grid;place-items:center;font-size:64px;position:relative}
.sl small{position:absolute;bottom:8px;inset-inline-start:10px;font-size:12px;color:#fff;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:99px}
.dots{position:absolute;bottom:12px;inset-inline-end:10px;display:flex;gap:5px}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5);cursor:pointer}.dots i.on{background:var(--gold-hi)}
.car .cp{position:absolute;top:8px;inset-inline-end:8px;background:rgba(18,18,18,.75);color:#fff}
.cb{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px}
.cb .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;font-size:12px;color:var(--mute)}
.cb .tx{white-space:pre-wrap;font-size:14px}
.cp{border:1px solid var(--gold);background:none;color:var(--text);border-radius:8px;font:inherit;font-size:12px;padding:3px 10px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:9px}
.seg button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;font:inherit;font-size:13px;padding:9px 4px;cursor:pointer}
.seg button.on{background:var(--ink);color:var(--gold-hi);border-color:var(--gold);font-weight:600}
.tt{flex:none;display:block;text-align:center;background:var(--ink);color:var(--gold-hi);font-size:12px;padding:6px;text-decoration:none;border-top:1px solid #2a2a2d}
.toast.ok{border-color:#16a34a}.toast.bad{border-color:#dc2626}
.dr{display:grid;grid-template-columns:30px 1fr 84px 84px;gap:4px;padding:7px 0;border-bottom:1px solid var(--line);font-size:12.5px;align-items:center}
.th{width:40px;height:40px;border-radius:8px;background:#eef2f7;display:grid;place-items:center;overflow:hidden;font-size:20px;flex:none}.th img,.sl img{width:100%;height:100%;object-fit:cover}
.sq{width:78px;padding:6px 8px}.btn.rd{background:#b91c1c;color:#fff}
.prev{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}.prev div{position:relative;width:68px;height:68px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}.prev img{width:100%;height:100%;object-fit:cover}.prev button{position:absolute;top:2px;inset-inline-end:2px;width:22px;height:22px;border:0;border-radius:50%;background:rgba(18,18,18,.8);color:#fff;cursor:pointer;line-height:1}
.p .im img{width:100%;height:100%;object-fit:cover}
.bell{position:absolute;inset-inline-end:10px;top:3px;background:none;border:0;font-size:21px;color:#fff;cursor:pointer;padding:4px}
.badge{position:absolute;top:-1px;inset-inline-end:-3px;background:var(--gold);color:#121212;border-radius:99px;font-size:11px;font-weight:800;padding:0 5px;min-width:17px;line-height:17px;text-align:center}
.nw{border-color:var(--gold)!important}
.seg2{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:99px;font:inherit;font-size:13px;padding:5px 12px;cursor:pointer}
.seg2.on{background:var(--ink);color:var(--gold-hi);border-color:var(--gold)}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover}
.cover{height:96px;background:linear-gradient(135deg,#121212,#8F7330 60%,#E9CF87)}
.pav{width:96px;height:96px;margin:-48px auto 0;border:4px solid var(--gold);font-size:44px;background:#3f3f46;position:relative}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.stat>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}.stat b{display:block;font-size:15px}.stat span{font-size:11px;color:var(--mute)}
.vok{color:#16a34a;font-size:12px;font-weight:600}
.empty{text-align:center;color:var(--mute);padding:30px 10px}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="brand" id="brand" hidden></div>
  <div class="top" id="top">
    <button class="av" id="av" aria-label="حسابي">👤</button>
    <button class="name" id="nm"></button>
    <button class="com" id="cm"><small>العمولة</small><span id="cv"></span></button>
  </div>
  <div class="body" id="body"></div>
  <div class="nav" id="nav"></div>
  <a class="tt" id="tt" href="https://www.tiktok.com/@eldoob.dz" target="_blank" rel="noopener" hidden>🎵 تابعنا على TikTok: آخر المنتجات والجديد يومياً</a>
  <div id="sheet" hidden></div>
  <div class="toast" id="toast" hidden></div>
</div>
<script src="/app.js"></script>
</body>
</html>
