<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ELDOOB.DZ — متجر الدب</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--ink:#121212;--gold:#C9A24B;--gold-hi:#E9CF87;--gold-lo:#8F7330;--bg:#F8FAFC;--card:#fff;--text:#121212;--mute:#64748b;--line:#e2e8f0;--out:#e5e7eb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0b0b0c;--card:#1a1a1c;--text:#f1f5f9;--mute:#94a3b8;--line:#2d2d31;--out:#000;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--card:#1a1a1c;--text:#f1f5f9;--mute:#94a3b8;--line:#2d2d31;--out:#000;color-scheme:dark}}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--out);font-family:Cairo,Tahoma,system-ui,sans-serif;font-size:15px;line-height:1.5;color:var(--text);display:flex;justify-content:center}
.phone{width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:600px){body{align-items:center}.phone{height:min(860px,96%);border-radius:30px;border:6px solid var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.25)}}
.brand{position:relative;background:var(--ink);display:flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px 0;color:#fff;flex:none}.brand b{font-weight:800;letter-spacing:1px;color:var(--gold-hi)}.brand small{color:#a1a1aa;font-size:12px}
.top{background:var(--ink);padding:10px 12px;display:flex;align-items:center;gap:10px;flex:none}
.top button{border:0;font:inherit;cursor:pointer}
.av{width:42px;height:42px;border-radius:50%;background:#3f3f46;color:#fff;font-size:20px;display:grid;place-items:center;border:2px solid var(--gold);flex:none}
.name{flex:1;background:#27272a;color:#fff;border-radius:99px;padding:8px 14px;text-align:start;font-size:14px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.com{background:linear-gradient(135deg,var(--gold-hi),var(--gold));color:#121212;border-radius:99px;padding:8px 14px;font-weight:800;font-size:14px;white-space:nowrap}
.com small{font-weight:600;font-size:11px;display:block;line-height:1;margin-bottom:1px}
.body{flex:1;overflow-y:auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;text-align:start;padding:0;font:inherit;color:inherit;display:block;width:100%}
.p .im{aspect-ratio:1/1;display:grid;place-items:center;font-size:48px;background:#eef2f7;position:relative}
.p .b{padding:8px 10px}.p .t{font-size:14px;font-weight:600;line-height:1.3}
.pr{font-weight:800}.mute{color:var(--mute);font-size:12px}
